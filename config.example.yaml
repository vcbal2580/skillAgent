# ============================================================
# Skill Agent Configuration - EXAMPLE / TEMPLATE
# ============================================================
# Copy this file to config.yaml and fill in your API keys:
#   cp config.example.yaml config.yaml
# config.yaml is git-ignored and will never be committed.
# ============================================================

# UI language: 'zh' = Chinese, 'en' = English
language: zh

llm:
  # Supported providers: openai / deepseek / zhipu / qwen / ollama (any OpenAI-compatible API)

  # ---- OpenAI ----
  # provider: "openai"
  # api_key: "sk-..."                        # https://platform.openai.com/api-keys
  # model: "gpt-4o-mini"

  # ---- DeepSeek ----
  # provider: "deepseek"
  # api_key: "sk-..."                        # https://platform.deepseek.com
  # base_url: "https://api.deepseek.com/v1"
  # model: "deepseek-chat"

  # ---- 智谱 GLM ----
  # provider: "zhipu"
  # api_key: "your-zhipu-api-key"            # https://open.bigmodel.cn
  # base_url: "https://open.bigmodel.cn/api/paas/v4"
  # model: "glm-4-flash"

  # ---- 通义千问 (default) ----
  provider: "qwen"
  api_key: "your-dashscope-api-key"          # https://dashscope.aliyun.com  or env: DASHSCOPE_API_KEY
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-plus"                         # qwen-turbo / qwen-plus / qwen-max / qwen-long
  temperature: 0.7
  max_tokens: 2048

  # ---- Ollama (local) ----
  # provider: "ollama"
  # api_key: "ollama"                        # any non-empty string
  # base_url: "http://localhost:11434/v1"
  # model: "qwen2.5:7b"

knowledge:
  # ChromaDB persistent vector store path
  persist_directory: "./data/chromadb"
  collection_name: "personal_knowledge"
  # Max results returned per semantic search
  top_k: 5

storage:
  # SQLite conversation history path
  db_path: "./data/agent.db"

agent:
  # System prompt sent to the LLM on every conversation.
  # Option A: write inline (below)
  # Option B: reference an external file:
  #   system_prompt: "file:persona.md"
  # persona.md is git-ignored so you can freely write personal context there.
  system_prompt: |
    你是一个智能助手，名叫 SkillAgent。你可以：
    1. 回答用户的各种问题
    2. 联网搜索最新信息
    3. 管理个人知识库（存储、检索、删除知识）
    4. 查询日期时间等实用信息
    
    请用中文回答，保持简洁友好。当你不确定答案时，可以使用搜索工具查找。
    当用户提供了想要记住的信息时，主动帮他们存入知识库。

  # Max tool-call iterations per user turn
  max_tool_calls: 5
  # Conversation turns to retain in context
  max_history: 20

api:
  host: "0.0.0.0"
  port: 8000

# ============================================================
# TTS 语音输出配置
# ============================================================
tts:
  # 总开关：true = 开启语音，false = 关闭语音（默认）
  enabled: false

  # 引擎选择：
  #   edge      — 微软神经网络 TTS，免费无 Key，中文质量最佳，需网络
  #   pyttsx3   — 系统本地引擎，完全离线，无需任何联网
  #   dashscope — 阿里云 CosyVoice，音色最就，复用已有 DashScope Key
  #   disabled  — 决不发声
  engine: edge

  # 运行时可输入 /tts 居一斶开关语音

  # ---- edge-tts 酿置 ----
  # 需要先安装: pip install edge-tts
  # 播放库 (任选一种): pip install pygame   或 pip install "playsound==1.2.2"
  edge:
    voice: zh-CN-XiaoxiaoNeural   # 女声温柔，推荐
    # voice: zh-CN-YunxiNeural    # 男声活泼
    # voice: zh-CN-YunjianNeural  # 男声低沉
    # voice: zh-TW-HsiaoChenNeural  # 繁中女声
    rate: "+0%"     # 语速偏移，如 +20% 加快、-10% 减慢
    volume: "+0%"   # 音量偏移

  # ---- pyttsx3 酿置 — 离线引擎 ----
  # 需要先安装: pip install pyttsx3
  pyttsx3:
    rate: 175         # 语速（词/分钟）
    volume: 1.0       # 音量 0.0 – 1.0
    voice_index: 0    # 系统语音列表所引，-1 = 自动

  # ---- DashScope CosyVoice 酿置 — 付费云端 ----
  # 需要先安装: pip install dashscope
  # 播放库 (任选一种): pip install pygame   或 pip install "playsound==1.2.2"
  dashscope:
    api_key: ""           # 空则自动复用 llm.api_key
    model: cosyvoice-v1   # cosyvoice-v1 / cosyvoice-v2
    voice: longxiaochun   # longxiaochun / longxiaoxia / longxiaomei / ...
    format: mp3

  # ---- Fish Audio 配置 — 社区声优库，支持大量动漫/游戏角色音色 ----
  # 需要先安装: pip install fish-audio-sdk
  # 播放库 (任选一种): pip install pygame   或 pip install "playsound==1.2.2"
  # 获取 API Key: https://fish.audio → 登录后左下角 API Keys
  # 查找音色 ID:
  #   1. 在 https://fish.audio 搜索角色名称（支持中文）
  #   2. 打开模型页面，URL 中的 UUID 即为 reference_id
  #      示例: https://fish.audio/m/7f92f8afb8ec43bf81429cc1c9199cb1/
  #                                     ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  fish:
    api_key: "your-fish-audio-api-key"  # 或设置环境变量 FISH_AUDIO_API_KEY
    format: mp3
    latency: normal       # normal=低延迟 / balanced=平衡
    chunk_length: 200     # 单次合成的字符数

    # ——— 大海赊人角色示例 ———
    # 将下面任意一行取注释即可切换到对应音色
    # （示例 ID 均为社区共享模型，可能随时更新；建议在 fish.audio 搜索确认最新 ID）
    reference_id: ""      # ← 填入下面任意一个 ID

    # 明日香（Asuka Langley，新世纪福音战士）
    # reference_id: "4a9e27f7e9334ff8ba088eea50d0a3db"

    # 鸣人（Naruto Uzumaki，火影忍者）
    # reference_id: "3b6b8e1ca6d14c9d9a9e74e2d42b5c9a"

    # 路飞（Monkey D. Luffy，海贼）
    # reference_id: "6c1d3f2a7e894b5cbf0d1234e5678901"

    # ——— 其它常用示例 ———
    # 派蓉（原神，天空之城）
    # reference_id: "paimon-voice-model-id-here"
    #
    # 服部半蘠（公会花子，火影忍者）
    # reference_id: "ino-yamanaka-voice-model-id-here"
