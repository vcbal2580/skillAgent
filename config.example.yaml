# ============================================================
# Skill Agent Configuration - EXAMPLE / TEMPLATE
# ============================================================
# Copy this file to config.yaml and fill in your API keys:
#   cp config.example.yaml config.yaml
# config.yaml is git-ignored and will never be committed.
# ============================================================

# UI language: 'zh' = Chinese, 'en' = English
language: zh

llm:
  # Supported providers: openai / deepseek / zhipu / qwen / ollama (any OpenAI-compatible API)

  # ---- OpenAI ----
  # provider: "openai"
  # api_key: "sk-..."                        # https://platform.openai.com/api-keys
  # model: "gpt-4o-mini"

  # ---- DeepSeek ----
  # provider: "deepseek"
  # api_key: "sk-..."                        # https://platform.deepseek.com
  # base_url: "https://api.deepseek.com/v1"
  # model: "deepseek-chat"

  # ---- 智谱 GLM ----
  # provider: "zhipu"
  # api_key: "your-zhipu-api-key"            # https://open.bigmodel.cn
  # base_url: "https://open.bigmodel.cn/api/paas/v4"
  # model: "glm-4-flash"

  # ---- 通义千问 (default) ----
  provider: "qwen"
  api_key: "your-dashscope-api-key"          # https://dashscope.aliyun.com  or env: DASHSCOPE_API_KEY
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-plus"                         # qwen-turbo / qwen-plus / qwen-max / qwen-long
  temperature: 0.7
  max_tokens: 2048

  # ---- Ollama (local) ----
  # provider: "ollama"
  # api_key: "ollama"                        # any non-empty string
  # base_url: "http://localhost:11434/v1"
  # model: "qwen2.5:7b"

knowledge:
  # ChromaDB persistent vector store path
  persist_directory: "./data/chromadb"
  collection_name: "personal_knowledge"
  # Max results returned per semantic search
  top_k: 5

storage:
  # SQLite conversation history path
  db_path: "./data/agent.db"

agent:
  # System prompt sent to the LLM on every conversation.
  # Option A: write inline (below)
  # Option B: reference an external file:
  #   system_prompt: "file:persona.md"
  # persona.md is git-ignored so you can freely write personal context there.
  system_prompt: |
    你是一个智能助手，名叫 SkillAgent。你可以：
    1. 回答用户的各种问题
    2. 联网搜索最新信息
    3. 管理个人知识库（存储、检索、删除知识）
    4. 查询日期时间等实用信息
    
    请用中文回答，保持简洁友好。当你不确定答案时，可以使用搜索工具查找。
    当用户提供了想要记住的信息时，主动帮他们存入知识库。

  # Max tool-call iterations per user turn
  max_tool_calls: 5
  # Conversation turns to retain in context
  max_history: 20

api:
  host: "0.0.0.0"
  port: 8000

# ============================================================
# WeCom (企业微信) - optional
# ============================================================
wecom:
  # ── 主动发送（群机器人 Webhook）──────────────────────────────
  # 获取方式：企业微信群 → 添加机器人 → 复制 Webhook 地址
  webhook_url: ""

  # ── 接收消息（自建应用回调）──────────────────────────────────
  # 使用 ngrok/frp/cpolar 内网穿透后，将公网 URL 填入企业微信后台：
  # 管理后台 → 应用管理 → 自建应用 → 接收消息 → 开启API接收
  corp_id: "ww..."          # 企业ID，在「我的企业」页面查看
  token: "your_token"      # 自定义 Token（与后台填写的一致）
  encoding_aes_key: ""     # 43位 EncodingAESKey；明文模式留空
  agent_id: "1000001"      # 应用 AgentID
  corp_secret: ""          # 应用 Secret（用于主动回复）
  callback_path: "/wecom/callback"  # 回调路径后缀

# ============================================================
# Feishu / Lark - optional, for reading private wiki documents
# ============================================================
# feishu:
  # user_access_token for private Feishu wiki pages
  # Obtain from: https://open.feishu.cn/  (developer console → token)
  # token: "u-xxxxxxxxxxxxxxxxxxxx"

# ============================================================
# Multimodal - Vision (Image Understanding)
# ============================================================
# Set llm.vision_model to a vision-capable model.
# If omitted, falls back to llm.model.
#
# Examples:
#   OpenAI:     gpt-4o
#   Qwen:       qwen-vl-plus  /  qwen-vl-max
#   Zhipu:      glm-4v
#
# llm:
#   vision_model: "qwen-vl-plus"

# ============================================================
# Multimodal - Speech To Text (STT / ASR)
# ============================================================
stt:
  # Engine choices: disabled | openai | dashscope
  engine: "disabled"

  # ---- OpenAI Whisper ----
  # engine: "openai"
  # openai_model: "whisper-1"        # default
  # api_key: "sk-..."                # leave blank to reuse llm.api_key
  # base_url: ""                     # leave blank to reuse llm.base_url
  # language: "zh"                   # optional BCP-47 hint

  # ---- Alibaba DashScope (Paraformer) ----
  # engine: "dashscope"
  # api_key: "your-dashscope-api-key"  # leave blank to reuse llm.api_key
  # language: "zh"

# ============================================================
# Document parsing (optional dependencies)
# ============================================================
# PDF:   pip install pypdf
# Word:  pip install python-docx
# Excel: pip install openpyxl
# Mic recording (for /voice in CLI): pip install sounddevice scipy
