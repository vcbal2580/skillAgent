{% extends "base.html" %}

{% block page_script %}
<script>
  function renderPage(items) {
    const root = document.getElementById("content-root");
    if (!items.length) {
      root.innerHTML = '<div class="empty">暂无内容</div>';
      return;
    }

    root.innerHTML = items.map((item) => {
      const time = item.time || item.timestamp || "";
      const body = item.body || item.content || "";
      const url = item.url || item.href || "";
      const title = item.title || "(无标题)";
      return `
        <article style="border:1px solid var(--border);background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:12px;">
          <div style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;">${time}</div>
          <h3 style="margin:0 0 8px 0;font-size:1rem;">${title}</h3>
          <p style="margin:0;line-height:1.7;color:#cbd5e1;">${body}</p>
          ${url ? `<div style="margin-top:10px;"><a href="${url}" target="_blank" rel="noopener noreferrer">查看来源</a></div>` : ""}
        </article>
      `;
    }).join("");
  }
</script>
{% endblock %}
